# Generated for Coolify from docker/docker-compose.yml + docker/.env.
# - Host ports removed (Traefik routes the domain to nginx:80); MQTT 1883/8883 (via mqtt-proxy) and CoAP 5683 stay published.
# - Secrets come from Coolify magic variables (SERVICE_PASSWORD_*); SMTP settings via MF_EMAIL_* env vars.
# Regenerate with: python docker/gen-coolify.py .  (from repo root)
services:
  alarms:
    depends_on:
    - mainflux-db
    - things
    environment:
      MF_ALARMS_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/alarms:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  audit:
    depends_on:
    - auth
    - es-redis
    - mainflux-db
    - things
    environment:
      MF_AUDIT_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/audit:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  auth:
    depends_on:
    - mainflux-db
    environment:
      MF_AUTH_DB_PASS: ${SERVICE_PASSWORD_MFDB}
      MF_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTHSECRET}
      MF_EMAIL_FROM_ADDRESS: ${MF_EMAIL_FROM_ADDRESS:-noreply@scalewest.com}
      MF_EMAIL_FROM_NAME: ${MF_EMAIL_FROM_NAME:-Mainflux}
      MF_EMAIL_HOST: ${MF_EMAIL_HOST:-smtp.example.com}
      MF_EMAIL_PASSWORD: ${MF_EMAIL_PASSWORD:-}
      MF_EMAIL_PORT: ${MF_EMAIL_PORT:-587}
      MF_EMAIL_USERNAME: ${MF_EMAIL_USERNAME:-}
      MF_USERS_ADMIN_EMAIL: ${MF_USERS_ADMIN_EMAIL:-admin@example.com}
    expose:
    - '8181'
    image: mainfluxlabs/auth:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    volumes:
    - ./templates/base.tmpl:/base.tmpl
    - ./templates/auth/org_invite.tmpl:/org_invite.tmpl
    env_file:
    - ./coolify/mainflux.env
  auth-redis:
    image: redis:6.2.2-alpine
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    volumes:
    - mainfluxlabs-auth-redis-volume:/data
  broker:
    command:
    - -c
    - /etc/nats/nats.conf
    image: nats:2.10-alpine
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    volumes:
    - ./nats:/etc/nats
    - mainfluxlabs-broker-volume:/data
  certs:
    depends_on:
    - mainflux-db
    environment:
      MF_CERTS_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/certs:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    volumes:
    - ./ssl/certs/ca.key:/etc/ssl/certs/ca.key
    - ./ssl/certs/ca.crt:/etc/ssl/certs/ca.crt
    - mainfluxlabs-crl-volume:/etc/ssl/certs/crl
    env_file:
    - ./coolify/mainflux.env
  coap-adapter:
    depends_on:
    - broker
    - things
    image: mainfluxlabs/coap:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    ports:
    - 5683:5683/udp
    - 5683:5683/tcp
    env_file:
    - ./coolify/mainflux.env
  converters:
    depends_on:
    - broker
    - things
    image: mainfluxlabs/converters:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  downlinks:
    depends_on:
    - broker
    - mainflux-db
    - things
    environment:
      MF_DOWNLINKS_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/downlinks:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  es-redis:
    image: redis:6.2.2-alpine
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    volumes:
    - mainfluxlabs-es-redis-volume:/data
  filestore:
    depends_on:
    - mainflux-db
    - things
    environment:
      MF_FILESTORE_DB_PASS: ${SERVICE_PASSWORD_MFDB}
      MF_FILESTORE_SECRET: ${SERVICE_PASSWORD_64_FILESTORESECRET}
    image: mainfluxlabs/filestore:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    volumes:
    - mainfluxlabs-filestore-volume:/files
    env_file:
    - ./coolify/mainflux.env
  http-adapter:
    depends_on:
    - broker
    - things
    image: mainfluxlabs/http:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  jaeger:
    image: jaegertracing/all-in-one:1.53
    networks:
    - mainfluxlabs-base-net
  modbus:
    depends_on:
    - broker
    - mainflux-db
    - things
    environment:
      MF_MODBUS_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/modbus:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  mosquitto:
    image: eclipse-mosquitto:2.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    volumes:
    - mainfluxlabs-mqtt-broker-volume:/mosquitto/data
    - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
  mqtt-adapter:
    depends_on:
    - broker
    - mainflux-db
    - mosquitto
    - things
    environment:
      MF_MQTT_ADAPTER_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/mqtt:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  nginx:
    depends_on:
    - http-adapter
    - mqtt-adapter
    - things
    - users
    environment:
      MF_ALARMS_DB_PORT: '5432'
      MF_ALARMS_HTTP_PORT: '9026'
      MF_AUDIT_DB_PORT: '5432'
      MF_AUDIT_HTTP_PORT: '9030'
      MF_AUTH_DB_PORT: '5432'
      MF_AUTH_GRPC_PORT: '8181'
      MF_AUTH_HTTP_PORT: '8189'
      MF_CERTS_DB_PORT: '5432'
      MF_CERTS_HTTP_PORT: '8204'
      MF_COAP_ADAPTER_PORT: '5683'
      MF_CONVERTERS_PORT: '8195'
      MF_DOWNLINKS_DB_PORT: '5432'
      MF_DOWNLINKS_HTTP_PORT: '9025'
      MF_EMAIL_PORT: '2525'
      MF_FILESTORE_DB_PORT: '5432'
      MF_FILESTORE_HTTP_PORT: '9022'
      MF_GRAFANA_PORT: '3000'
      MF_HTTP_ADAPTER_PORT: '8185'
      MF_JAEGER_PORT: '6831'
      MF_MODBUS_DB_PORT: '5432'
      MF_MODBUS_HTTP_PORT: '9028'
      MF_MQTT_ADAPTER_DB_PORT: '5432'
      MF_MQTT_ADAPTER_HTTP_PORT: '8285'
      MF_MQTT_ADAPTER_MQTT_PORT: '1883'
      MF_MQTT_ADAPTER_WS_PORT: '8080'
      MF_MQTT_BROKER_PORT: '1883'
      MF_MQTT_BROKER_WS_PORT: '8080'
      MF_NATS_PORT: '4222'
      MF_NGINX_HTTP_PORT: '80'
      MF_NGINX_MQTT_PORT: '1883'
      MF_NGINX_MQTTS_PORT: '8883'
      MF_NGINX_SSL_PORT: '443'
      MF_POSTGRES_READER_DB_PORT: '5432'
      MF_POSTGRES_READER_GRPC_PORT: '8186'
      MF_POSTGRES_READER_PORT: '8905'
      MF_POSTGRES_WRITER_DB_PORT: '5432'
      MF_POSTGRES_WRITER_PORT: '8900'
      MF_RABBITMQ_HTTP_PORT: '15672'
      MF_RABBITMQ_PORT: '5672'
      MF_REDIS_TCP_PORT: '6379'
      MF_RULES_DB_PORT: '5432'
      MF_RULES_HTTP_PORT: '9027'
      MF_SHADOWS_DB_PORT: '5432'
      MF_SHADOWS_HTTP_PORT: '9031'
      MF_SMPP_NOTIFIER_DB_PORT: '5432'
      MF_SMPP_NOTIFIER_PORT: '9024'
      MF_SMTP_NOTIFIER_DB_PORT: '5432'
      MF_SMTP_NOTIFIER_PORT: '9023'
      MF_THINGS_AUTH_GRPC_PORT: '8183'
      MF_THINGS_AUTH_HTTP_PORT: '8989'
      MF_THINGS_DB_PORT: '5432'
      MF_THINGS_HTTP_PORT: '8182'
      MF_TIMESCALE_READER_DB_PORT: '5432'
      MF_TIMESCALE_READER_PORT: '8906'
      MF_TIMESCALE_WRITER_DB_PORT: '5432'
      MF_TIMESCALE_WRITER_PORT: '8902'
      MF_UI_CONFIGS_DB_PORT: '5432'
      MF_UI_CONFIGS_HTTP_PORT: '9029'
      MF_UI_PORT: '3000'
      MF_USERS_DB_PORT: '5432'
      MF_USERS_GRPC_PORT: '8184'
      MF_USERS_HTTP_PORT: '8180'
      MF_WEBHOOKS_DB_PORT: '5432'
      MF_WEBHOOKS_HTTP_PORT: '9021'
      MF_WS_ADAPTER_PORT: '8190'
      SERVICE_FQDN_NGINX_80:
    image: nginx:1.20.0-alpine
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    volumes:
    - ./nginx/nginx-key.conf:/etc/nginx/nginx.conf.template
    - ./nginx/entrypoint.sh:/docker-entrypoint.d/entrypoint.sh
    - ./nginx/snippets:/etc/nginx/snippets
    - ./ssl/authorization.js:/etc/nginx/authorization.js
    - ./ssl/certs/mainfluxlabs-server.crt:/etc/ssl/certs/mainfluxlabs-server.crt
    - ./ssl/certs/ca.crt:/etc/ssl/certs/ca.crt
    - ./ssl/certs/mainfluxlabs-server.key:/etc/ssl/private/mainfluxlabs-server.key
    - ./ssl/dhparam.pem:/etc/ssl/certs/dhparam.pem
    - mainfluxlabs-crl-volume:/etc/ssl/certs/crl
  rules:
    depends_on:
    - mainflux-db
    - things
    environment:
      MF_RULES_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/rules:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  shadows:
    depends_on:
    - broker
    - mainflux-db
    - things
    environment:
      MF_SHADOWS_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/shadows:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  smtp-notifier:
    depends_on:
    - mainflux-db
    - things
    environment:
      MF_EMAIL_FROM_ADDRESS: ${MF_EMAIL_FROM_ADDRESS:-noreply@scalewest.com}
      MF_EMAIL_FROM_NAME: ${MF_EMAIL_FROM_NAME:-Mainflux}
      MF_EMAIL_HOST: ${MF_EMAIL_HOST:-smtp.example.com}
      MF_EMAIL_PASSWORD: ${MF_EMAIL_PASSWORD:-}
      MF_EMAIL_PORT: ${MF_EMAIL_PORT:-587}
      MF_EMAIL_USERNAME: ${MF_EMAIL_USERNAME:-}
      MF_SMTP_NOTIFIER_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/smtp-notifier:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    volumes:
    - ./templates/base.tmpl:/base.tmpl
    - ./templates/smtp/notification.tmpl:/notification.tmpl
    env_file:
    - ./coolify/mainflux.env
  things:
    depends_on:
    - auth
    - mainflux-db
    environment:
      MF_EMAIL_FROM_ADDRESS: ${MF_EMAIL_FROM_ADDRESS:-noreply@scalewest.com}
      MF_EMAIL_FROM_NAME: ${MF_EMAIL_FROM_NAME:-Mainflux}
      MF_EMAIL_HOST: ${MF_EMAIL_HOST:-smtp.example.com}
      MF_EMAIL_PASSWORD: ${MF_EMAIL_PASSWORD:-}
      MF_EMAIL_PORT: ${MF_EMAIL_PORT:-587}
      MF_EMAIL_USERNAME: ${MF_EMAIL_USERNAME:-}
      MF_THINGS_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/things:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    volumes:
    - ./templates/base.tmpl:/base.tmpl
    - ./templates/things/group_membership.tmpl:/group_membership.tmpl
    env_file:
    - ./coolify/mainflux.env
  timescale-db:
    environment:
      POSTGRES_DB: mainflux
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_MFDB}
      POSTGRES_USER: mainflux
    image: timescale/timescaledb:2.15.3-pg16
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    volumes:
    - mainfluxlabs-timescale-db-volume:/var/lib/postgresql/data
  timescale-reader:
    environment:
      MF_TIMESCALE_READER_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/timescale-reader:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  timescale-writer:
    depends_on:
    - timescale-db
    environment:
      MF_TIMESCALE_WRITER_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/timescale-writer:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  ui:
    image: mainfluxlabs/ui:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  uiconfigs:
    depends_on:
    - mainflux-db
    environment:
      MF_UI_CONFIGS_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/uiconfigs:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  users:
    depends_on:
    - auth
    - mainflux-db
    environment:
      MF_EMAIL_FROM_ADDRESS: ${MF_EMAIL_FROM_ADDRESS:-noreply@scalewest.com}
      MF_EMAIL_FROM_NAME: ${MF_EMAIL_FROM_NAME:-Mainflux}
      MF_EMAIL_HOST: ${MF_EMAIL_HOST:-smtp.example.com}
      MF_EMAIL_PASSWORD: ${MF_EMAIL_PASSWORD:-}
      MF_EMAIL_PORT: ${MF_EMAIL_PORT:-587}
      MF_EMAIL_USERNAME: ${MF_EMAIL_USERNAME:-}
      MF_USERS_ADMIN_EMAIL: ${MF_USERS_ADMIN_EMAIL:-admin@example.com}
      MF_USERS_ADMIN_PASSWORD: ${SERVICE_PASSWORD_MFADMIN}
      MF_USERS_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    expose:
    - '8184'
    image: mainfluxlabs/users:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    volumes:
    - ./templates/base.tmpl:/base.tmpl
    - ./templates/users/email_verification.tmpl:/email_verification.tmpl
    - ./templates/users/password_reset.tmpl:/password_reset.tmpl
    - ./templates/users/platform_invite.tmpl:/platform_invite.tmpl
    env_file:
    - ./coolify/mainflux.env
  webhooks:
    depends_on:
    - broker
    - mainflux-db
    - things
    environment:
      MF_WEBHOOKS_DB_PASS: ${SERVICE_PASSWORD_MFDB}
    image: mainfluxlabs/webhooks:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  ws-adapter:
    depends_on:
    - broker
    - things
    image: mainfluxlabs/ws:v0.43.0
    networks:
    - mainfluxlabs-base-net
    restart: on-failure
    env_file:
    - ./coolify/mainflux.env
  mainflux-db:
    image: postgres:13.3-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: mainflux
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_MFDB}
      POSTGRES_DB: postgres
      MF_DATABASES: alarms audit auth certs downlinks filestore modbus rules shadows smtp-notifiers subscriptions things uiconfigs users webhooks
    volumes:
    - mainflux-db-volume:/var/lib/postgresql/data
    - ./coolify/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    networks:
      mainfluxlabs-base-net:
        aliases:
        - alarms-db
        - audit-db
        - auth-db
        - certs-db
        - downlinks-db
        - filestore-db
        - modbus-db
        - mqtt-db
        - rules-db
        - shadows-db
        - smtp-notifier-db
        - things-db
        - uiconfigs-db
        - users-db
        - webhooks-db
  mqtt-proxy:
    image: alpine/socat:1.8.0.3
    entrypoint:
    - /bin/sh
    - -c
    command:
    - socat TCP-LISTEN:8883,fork,reuseaddr TCP:nginx:8883 & exec socat TCP-LISTEN:1883,fork,reuseaddr TCP:nginx:1883
    restart: on-failure
    depends_on:
    - nginx
    ports:
    - 1883:1883
    - 8883:8883
    networks:
    - mainfluxlabs-base-net
networks:
  mainfluxlabs-base-net:
    driver: bridge
volumes:
  mainfluxlabs-auth-redis-volume: {}
  mainfluxlabs-broker-volume: {}
  mainfluxlabs-crl-volume: {}
  mainfluxlabs-es-redis-volume: {}
  mainfluxlabs-filestore-volume: {}
  mainfluxlabs-mqtt-broker-volume: {}
  mainfluxlabs-timescale-db-volume: {}
  mainflux-db-volume:
